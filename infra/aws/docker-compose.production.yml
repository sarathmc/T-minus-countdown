services:
  frontend:
    image: ${ECR_REGISTRY}/t-minus/frontend:${IMAGE_TAG}
    container_name: t-minus-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/t-minus/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/t-minus/config.js:/usr/share/nginx/html/config.js:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /opt/t-minus/certbot/www:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
    logging: &awslogs
      driver: awslogs
      options:
        awslogs-region: ap-south-1
        awslogs-group: /aws/ec2/t-minus
        awslogs-stream: frontend
        awslogs-create-group: "true"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    image: ${ECR_REGISTRY}/t-minus/api:${IMAGE_TAG}
    container_name: t-minus-api
    restart: unless-stopped
    env_file:
      - /opt/t-minus/.env.production
    expose:
      - "3000"
    logging:
      <<: *awslogs
      options:
        awslogs-stream: api
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/readiness').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    image: ${ECR_REGISTRY}/t-minus/worker:${IMAGE_TAG}
    container_name: t-minus-worker
    restart: unless-stopped
    command: ["npm", "run", "start:worker"]
    env_file:
      - /opt/t-minus/.env.production
    expose:
      - "3001"
    logging:
      <<: *awslogs
      options:
        awslogs-stream: worker
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
